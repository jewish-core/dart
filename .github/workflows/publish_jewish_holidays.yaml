name: Publish jewish_holidays

on:
  push:
    tags: ['jewish_holidays-v[0-9]+.[0-9]+.[0-9]+*']

jobs:
  publish:
    permissions:
      id-token: write # pub.dev verifies this workflow through OIDC; no secret is stored
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      environment: pub.dev
      working-directory: jewish_holidays
